# Grype configuration for the image scan in .github/workflows/security.yml.
# See docs/security.md, "Out of scope", and docs/decisions.md.
#
# 2026-09-16: Grafana's own binaries (/usr/share/grafana: the grafana binary
# and the backend plugins Grafana bundles) are excluded from the scan. They
# are upstream's build (grafana/grafana:13.2.2-ubuntu) and the first scan
# found some forty High advisories in the Go modules compiled into them,
# which only a Grafana release changes; this repository rebuilds against
# each release. Everything else stays gated: the OS packages, and this
# app's own files, including the SWIS backend compiled here, which lives
# under /opt/grafana-app for exactly this reason.
exclude:
  - /usr/share/grafana/**
