# nginx-light in front of Grafana: the Ingress door, the role gate, the
# terminal gate, the access log, and the optional API port. Runs as the
# grafana user (472), so every path it writes is one that user owns.
#
# Identity. The Supervisor authenticates the Home Assistant session, strips
# any X-Remote-User-* header the browser sent, and attaches
# X-Remote-User-Name (the login name) and X-Remote-User-Display-Name
# before proxying to this port from 172.30.32.2. Grafana's auth proxy is
# told the username in X-WEBAUTH-USER and the role in X-WEBAUTH-ROLE; the
# role comes from the maps run.sh generates from the admin_users and
# editor_users options. A username in neither list gets the default_role
# option: "Viewer", or "none", which is the 403 page below.

worker_processes 1;
pid /run/grafana-app/nginx.pid;
# "stderr" is nginx's own name for its inherited fd 2; opening /dev/stderr by
# path fails for an unprivileged worker under Docker.
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    gzip on;

    # Writable temp paths for an unprivileged worker.
    client_body_temp_path /run/grafana-app/client_body;
    proxy_temp_path /run/grafana-app/proxy;
    fastcgi_temp_path /run/grafana-app/fastcgi;
    uwsgi_temp_path /run/grafana-app/uwsgi;
    scgi_temp_path /run/grafana-app/scgi;

    # One JSON line per request with the Home Assistant identity, for the SOC
    # audit trail; rotated by logrotate under run.sh's control.
    log_format ingress_access escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"user_id":"$http_x_remote_user_id",'
        '"user_name":"$http_x_remote_user_name",'
        '"user_display_name":"$http_x_remote_user_display_name",'
        '"role":"$grafana_role",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"user_agent":"$http_user_agent"'
        '}';
    access_log /data/log/nginx/access.log ingress_access;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Role by Home Assistant username. run.sh writes the two included files
    # from the options; the default line is the default_role option.
    map $http_x_remote_user_name $grafana_role {
        default %%default_role%%;
        ""      "";
        include /run/grafana-app/roles.map;
    }

    # Terminal: administrators only, and only when the option is on.
    map $grafana_role $terminal_allowed {
        default 0;
        "Admin" %%terminal_enabled%%;
    }

    upstream grafana {
        server 127.0.0.1:3000;
        keepalive 8;
    }

    upstream terminal {
        server 127.0.0.1:7681;
    }

    # ---- Ingress ---------------------------------------------------------
    server {
        listen 1337 default_server;
        server_name _;

        # The Ingress gateway, and loopback for the container health check.
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        error_page 403 /_grafana_app/not_authorized.html;
        location = /_grafana_app/not_authorized.html {
            internal;
            root /usr/share/grafana-app;
        }

        # The container health check: no identity, loopback only, and the
        # one path that answers without a Home Assistant user.
        location = /api/health {
            proxy_pass http://grafana;
            proxy_set_header X-WEBAUTH-USER "";
            proxy_set_header X-WEBAUTH-NAME "";
            proxy_set_header X-WEBAUTH-ROLE "";
        }

        location /terminal/ {
            # Ingress always attaches the username; a request without one
            # did not come through Ingress and gets nothing.
            if ($http_x_remote_user_name = "") {
                return 401;
            }
            if ($terminal_allowed != 1) {
                return 403;
            }
            # ttyd's --url-arg hands ?arg= to the session wrapper as its
            # argument. The query string is replaced here, so the browser
            # cannot choose the value: it is always the Ingress username.
            set $args "arg=$http_x_remote_user_name";
            # The prefix is stripped: ttyd serves its page at / and its
            # WebSocket at /ws, and its page resolves both relative to the
            # URL the browser used, which keeps the Ingress prefix.
            proxy_pass http://terminal/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        location / {
            if ($http_x_remote_user_name = "") {
                return 401;
            }
            # A user in neither role list, with default_role "none".
            if ($grafana_role = "none") {
                return 403;
            }
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # The identity Grafana's auth proxy trusts from loopback only.
            proxy_set_header X-WEBAUTH-USER $http_x_remote_user_name;
            proxy_set_header X-WEBAUTH-NAME $http_x_remote_user_display_name;
            proxy_set_header X-WEBAUTH-ROLE $grafana_role;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }

    # ---- Optional API port -------------------------------------------------
    # Reachable only if the operator maps 3080 to a host port. No Ingress
    # identity exists here, so the auth-proxy headers are emptied and Grafana
    # falls through to its remaining authenticator: service-account tokens.
    # The login form and basic auth are off, so a browser gets nothing.
    server {
        listen 3080;
        server_name _;

        location / {
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-WEBAUTH-USER "";
            proxy_set_header X-WEBAUTH-NAME "";
            proxy_set_header X-WEBAUTH-ROLE "";
            proxy_read_timeout 300s;
        }
    }
}
